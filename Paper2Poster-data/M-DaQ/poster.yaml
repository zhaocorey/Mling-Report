# Paper2Poster Style Configuration — M-DaQ @ SIGIR 2026
# See: https://github.com/Paper2Poster/Paper2Poster

poster:
  # Dimensions (A0 portrait in inches)
  width_inches: 33.1
  height_inches: 46.8
  orientation: portrait

  # Margins (cm)
  margin_top: 3.0
  margin_bottom: 3.0
  margin_left: 3.0
  margin_right: 3.0

  # Layout
  columns: 3
  column_ratios: [0.30, 0.40, 0.30]
  column_gap_cm: 2.0

title:
  text: "M-DaQ: Retrieving Samples with Multilingual Diversity and Quality for Instruction Fine-Tuning Datasets"
  font_size_pt: 72
  font_family: Arial
  font_weight: bold
  color: "#FFFFFF"
  background_color: "#1B3A5C"
  alignment: center

authors:
  text: "Chunguang Zhao¹ · Yilun Liu¹ · Pufan Zeng² · Yuanchang Luo¹ · Shimin Tao¹ · Minggui He¹ · Weibin Meng¹ · Song Xu² · Chen Liu¹ · Hongxia Ma¹ · Li Zhang¹ · Boxing Chen¹ · Daimeng Wei¹"
  font_size_pt: 28
  font_family: Arial
  color: "#333333"

affiliations:
  text: "¹ Huawei Technologies Ltd.    ² University of Science and Technology of China"
  font_size_pt: 22
  font_family: Arial
  color: "#666666"

sections:
  header:
    font_size_pt: 36
    font_family: Arial
    font_weight: bold
    color: "#1B3A5C"
    underline: true
    underline_color: "#E8792B"

  body:
    font_size_pt: 24
    font_family: Arial
    color: "#222222"
    line_spacing: 1.3
    bullet_style: "•"

  caption:
    font_size_pt: 20
    font_family: Arial
    font_style: italic
    color: "#666666"

colors:
  primary: "#1B3A5C"       # Deep blue — headers, title bar
  accent: "#E8792B"        # Bright orange — emphasis numbers, highlights
  background: "#FFFFFF"    # White — main background
  card_background: "#F0F4F8"  # Light gray-blue — table/card fills
  text: "#222222"          # Dark gray — body text
  text_secondary: "#666666"  # Medium gray — captions, footnotes

logos:
  institution:
    - path: "logos/huawei_favicon.svg"  # SVG 矢量：红色花瓣图标 + HUAWEI 文字（白底适用）
      position: top-left
      note: "备选: logos/huawei_touch_icon.png (红底白字方形图标)"
    - path: "logos/ustc_logo.svg"       # SVG 矢量：蓝色校名（#034ea1，白底适用）
      position: top-right
  conference:
    path: null  # SIGIR 2026 官方 logo 待确认
    position: top-center

qr_code:
  url: "https://github.com/zhaocorey/M-DaQ"
  position: bottom-right
  size_cm: 4.0

figures:
  - id: figure2_pipeline
    source_pdf: paper.pdf
    page: null  # auto-detect
    caption: "M-DaQ Framework: QSM (Quality Scoring Model) + DAS (Diversity-Aware Selection) two-stage pipeline."
    placement: center-column-top
    width_pct: 90

  - id: figure1b_winrates
    source_pdf: paper.pdf
    caption: "Cross-lingual win rates across 18 languages on Alpaca-Eval and MT-Bench. M-DaQ consistently exceeds 50% threshold."
    placement: center-column-bottom
    width_pct: 90

  - id: figure4_sah
    source_pdf: paper.pdf
    caption: "SAH validation: average win rate vs. IFT dataset scale (1K–52K) across 8 languages."
    placement: left-column-bottom
    width_pct: 85

  - id: figure3_corsica
    source_pdf: paper.pdf
    caption: "Cultural localization example: M-DaQ (right) incorporates Corsica-specific knowledge vs. generic baseline (left)."
    placement: right-column-middle
    width_pct: 85

tables:
  - id: table1_human_eval
    source_pdf: paper.pdf
    caption: "Human-evaluated win rates across 6 languages. Average: 78.0% / 85.0% / 85.3%."
    placement: right-column-top
    width_pct: 85

footer:
  text: "SIGIR 2026 · Melbourne, VIC, Australia · July 20–24, 2026"
  font_size_pt: 18
  font_family: Arial
  color: "#999999"
  alignment: center
